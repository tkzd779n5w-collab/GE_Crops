<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene-Edited Crops Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gene-Edited Crops Atlas</h1>
    <p class="subtitle">Commercially approved gene-edited (SDN-1/CRISPR/TALEN) crops worldwide, by innovation.
      Inspired by <a href="https://ejatlas.org/" target="_blank" rel="noopener">EJAtlas</a>.</p>
  </header>

  <main>
    <div id="map-wrap">
      <div id="map"></div>
      <aside id="detail-panel" class="detail-panel">
        <button id="detail-close" class="detail-close" aria-label="Close">&times;</button>
        <div id="detail-content"></div>
      </aside>
    </div>
  </main>

  <footer>
    <p>Data: curated GE crop approvals catalogue, CC BY 4.0 · Basemap: &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="map.js"></script>
</body>
</html>
